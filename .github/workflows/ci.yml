name: CI

on:
  push:
    branches: [master, react]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck, tests, builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build (SPA + widget)
        run: npm run build
      - name: Demo build
        run: npm run build:demo
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and visual tests
        run: npm run test:e2e

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Run tests
        env:
          DATABASE_URL: "sqlite://"
        run: pytest tests/ -q
